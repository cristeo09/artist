<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIANA | Order Confirmed</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="thanks-body">
    <div class="container">
        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <h1>Order Confirmed!</h1>
        <p>Thank you for supporting Diana. Your order is on its way.</p>
        <a href="index.html" class="btn">Back to Site</a>
    </div>

    <script>
        // Simple JS Confetti
        const colors = ['#3B82F6', '#1A1A1A', '#93C5FD', '#E5E7EB'];
        for (let i = 0; i < 75; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            // Randomize fall duration and delay
            const duration = Math.random() * 3 + 2; // 2s to 5s
            const delay = Math.random() * 1.5; // 0s to 1.5s
            
            confetti.style.animationDuration = duration + 's';
            confetti.style.animationDelay = delay + 's';
            
            document.body.appendChild(confetti);
        }
    </script>
</body>
</html>
